# =========================================================================
# SYSTEM OVERRIDES (override.yaml)
# =========================================================================
# This file is strictly untracked by Git formatting (.gitignore).
# Any variable structure perfectly matching `llm.yaml` that is declared
# here will completely overwrite the base setting in logic.
#
# DO NOT put API keys here. API keys belong purely in `.env`.

# --- 1. Local Endpoint Definitions ---
# Since local instances like Ollama or Llama.cpp have no "default" canonical
# web address, you must define your specific local network IPs here:
urls:
  local_llama_base_url: http://192.168.0.38:8080/v1
  ollama_base_url: http://192.168.0.38:11434/v1
  
# --- 2. Custom Pricing Overrides ---
# Token costs are structured as [prompt_cost, completion_cost] per 1 Million tokens.
# The system automatically downloads live OpenRouter API prices into `logs/pricing/`,
# which natively map out to your OpenAI, Anthropic, and Google adapters seamlessly. 
#
# Only override prices here for local servers, completely free tiers, 
# or explicit enterprise contracts.
pricing:
  # Local, free, and self-hosted models that don't exist on public routing:
  ollama:
    "llama3.1:8b": [0.0, 0.0]
    "llama3:8b": [0.0, 0.0]
    "llama3.2:3b": [0.0, 0.0]
  local:
    local-model: [0.0, 0.0]
    
  # Specific native overrides (e.g. if you have a free-tier Groq API key):
  groq:
    llama-3.1-8b-instant: [0.0, 0.0]
    llama-3.1-70b-versatile: [0.0, 0.0]

  # Example of hardcoding a direct override for a mainstream model:
  # anthropic:
  #   claude-3-5-sonnet: [3.00, 15.00]
